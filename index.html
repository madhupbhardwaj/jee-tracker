<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>JEE Study Tracker</h1>
    <div class="sub">Time is saved automatically in your browser and persists across sessions.</div>
  </header>

  <div class="cards" id="cards"></div>

  <div class="grand">
    <span class="label">Total time studied</span>
    <span class="val" id="grandTotal">0h 0m 0s</span>
  </div>
  <div class="save-note" id="saveNote">Saved</div>

  <footer>Data is stored locally on this device (localStorage). Clearing browser data will erase it.</footer>
</div>

<script src="script.js"></script>
</body>
</html>
